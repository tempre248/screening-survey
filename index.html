<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>适龄女性宫颈癌筛查行为调查问卷</title><link rel="stylesheet" href="style.css"></head>
<body><header><span class="mark">＋</span> 女性健康 · 科研问卷 <span class="tag">自愿参与</span></header><main><section class="hero"><small>WOMEN'S HEALTH RESEARCH</small><h1>关注女性健康<br>从倾听您的经历开始</h1><p>适龄女性宫颈癌筛查行为调查问卷</p><div class="badges">六个部分　·　可跳过不愿回答的问题　·　不收集姓名</div></section><section id="welcome" class="card"><h2>填写前，请您阅读</h2><div id="intro"></div><p class="notice">填写完成后，可提交答卷供研究人员保存和分析，也可下载备份。未提交的内容在刷新或关闭页面后会丢失。当前收集状态：<span id="connection-state">正在检查</span>。</p><label class="option"><input id="consent" type="checkbox">我已阅读说明，自愿参加本次调查。</label><button id="start">开始填写 →</button></section><section id="survey" hidden><div class="progress"><span id="step"></span><span id="count"></span></div><progress id="bar" max="6" value="1"></progress><nav id="tabs" aria-label="问卷部分"></nav><form id="form" class="card"></form><div class="actions"><button id="prev" class="secondary">上一部分</button><button id="next">下一部分 →</button></div><p class="foot">您可随时退出，也可留空不愿回答的问题。</p></section><section id="done" class="card" hidden><h2>感谢您的参与</h2><p>请检查答卷后点击提交。只有收到保存成功的提示，才表示答卷已存入数据库。</p><p id="submit-status" role="status" aria-live="polite"></p><button id="submit-response">提交答卷并保存</button><button id="download" class="secondary">下载我的答卷（JSON）</button><button id="back" class="secondary">返回检查</button></section></main><footer>女性健康研究</footer><script src="survey.js"></script><script src="config.js"></script><script src="app.js"></script><script src="submission.js"></script></body></html>
